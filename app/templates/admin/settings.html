{% extends "admin/base_admin.html" %}
{% block admin_content %}
<div class="card-neumo p-3">
  <form class="row g-3" method="post" action="{{ url_for('admin_settings_save') }}">
    <div class="col-md-6">
      <div class="p-3 border rounded-4">
        <div class="fw-bold mb-2">Thème</div>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Primaire</label>
            <input type="color" class="form-control form-control-color" name="THEME_PRIMARY" value="{{ cfg.THEME_PRIMARY }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Secondaire (texte)</label>
            <input type="color" class="form-control form-control-color" name="THEME_SECONDARY" value="{{ cfg.THEME_SECONDARY }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">Max upload (Mo)</label>
            <input class="form-control" name="MAX_UPLOAD_SIZE_MB" value="{{ cfg.MAX_UPLOAD_SIZE_MB }}">
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="p-3 border rounded-4">
        <div class="fw-bold mb-2">Configuration SMTP</div>
        <style>
          .smtp-config input,
          .smtp-config select {
            height: 32px;
            padding: 4px 8px;
            font-size: 14px;
          }
        </style>
        <div class="row g-2 smtp-config">
          <div class="col-md-6">
            <label class="form-label">Hôte</label>
            <input class="form-control" name="SMTP_HOST" value="{{ cfg.SMTP_HOST }}" placeholder="smtp.gmail.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">Port</label>
            <input type="number" class="form-control" name="SMTP_PORT" value="{{ cfg.SMTP_PORT }}" placeholder="587">
          </div>
          <div class="col-md-6">
            <label class="form-label">Utilisateur (Email)</label>
            <input type="email" class="form-control" name="SMTP_USER" value="{{ cfg.SMTP_USER }}" placeholder="votre-email@gmail.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">Mot de passe</label>
            <input type="password" class="form-control" name="SMTP_PASSWORD" value="{{ cfg.SMTP_PASSWORD }}" placeholder="Mot de passe ou mot de passe d'application">
            <small class="text-muted">Pour Gmail, utilisez un mot de passe d'application si l'authentification à 2 facteurs est activée</small>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email expéditeur</label>
            <input type="email" class="form-control" name="MAIL_FROM" value="{{ cfg.MAIL_FROM }}" placeholder="noreply@example.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">TLS</label>
            <select class="form-select" name="SMTP_TLS">
              <option value="True" {% if cfg.SMTP_TLS in ['True','true','1'] %}selected{% endif %}>Activé</option>
              <option value="False" {% if cfg.SMTP_TLS in ['False','false','0'] %}selected{% endif %}>Désactivé</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #e0e0e0;">
      <div style="display: flex; justify-content: flex-end;">
        <button class="btn btn-primary"><i class="fa fa-save me-1"></i> Sauvegarder</button>
      </div>
    </div>
  </form>
  
</div>
{% endblock %}
