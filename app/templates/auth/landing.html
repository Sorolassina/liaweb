<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - {{ app_name }}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    
    <!-- CSS de base -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           STYLES SPÉCIFIQUES À LA PAGE DE LANDING
           ======================================== */

        /* Reset pour la page de landing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--white-color);
            overflow: hidden;
            position: relative;
        }

        /* Arrière-plan avec carrousel d'images */
        .background-carousel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .background-carousel .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .background-carousel .bg-image.active {
            opacity: 1;
        }

        /* Overlay pour améliorer la lisibilité */
        .background-carousel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Layout principal */
        .login-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            box-sizing: border-box;
            margin: 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
        }

        .landing-wrapper {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Logo et titre */
        .landing-header {
            margin-bottom: 48px;
        }

        .logo-container {
            margin: 0 auto 24px;
            width: 120px;
            height: 120px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            padding: 12px;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            border: 4px solid var(--secondary-color);
            box-shadow: 0 8px 16px var(--white-color);
            background-color: var(--primary-color);
        }

        .landing-title {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--white-color);
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.2);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .landing-subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 300;
            font-style: italic;
            color: var(--white-color);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
            line-height: 1.6;
        }

        /* Conteneur des boutons */
        .menu-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 48px;
        }

        .menu-button {
            width: 100%;
            padding: 24px 32px;
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            background: #ffc425;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .menu-button:hover::before {
            left: 100%;
        }

        .menu-button:hover {
            background: var(--white-color);
            color: var(--text-color);
            border-color: rgba(255, 255, 255, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .menu-button:active {
            transform: translateY(-2px);
        }

        .menu-button-icon {
            font-size: 28px;
        }

        /* Horloge style écran de veille Microsoft */
        .clock-container {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 100;
            color: white;
            font-family: 'Segoe UI Light', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 2px 10px rgba(0, 0, 0, 0.5);
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }

        .clock-time {
            font-size: 120px;
            font-weight: 100;
            line-height: 1;
            letter-spacing: -2px;
            margin: 0;
            padding: 0;
        }

        .clock-date {
            font-size: 28px;
            font-weight: 300;
            line-height: 1.2;
            margin-top: 10px;
            opacity: 0.9;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .clock-time {
                font-size: 80px;
            }

            .clock-date {
                font-size: 22px;
            }
        }

        @media (max-width: 640px) {
            .clock-container {
                top: 20px;
                left: 20px;
            }

            .clock-time {
                font-size: 60px;
            }

            .clock-date {
                font-size: 18px;
            }

            .landing-title {
                font-size: 32px;
            }

            .landing-subtitle {
                font-size: 16px;
            }

            .menu-button {
                padding: 20px 24px;
                font-size: 18px;
            }

            .logo-container {
                width: 100px;
                height: 100px;
            }
        }

        @media (max-height: 600px) {
            .clock-container {
                top: 15px;
                left: 15px;
            }

            .clock-time {
                font-size: 50px;
            }

            .clock-date {
                font-size: 16px;
            }

            .landing-header {
                margin-bottom: 32px;
            }

            .menu-buttons-container {
                margin-top: 32px;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Carrousel d'images en arrière-plan -->
    <div class="background-carousel" id="backgroundCarousel">
        <div class="bg-image active" style="background-image: url('/static/images/backgroundlogin/BGECtedAzurmobilisdansleprogrammeEntrepreneuriatQuartiers2030png_6787bf6156e1a2.15278416.png');" data-index="0"></div>
        <div class="bg-image" style="background-image: url('/static/images/backgroundlogin/BIG-BPI.webp');" data-index="1"></div>
        <div class="bg-image" style="background-image: url('/static/images/backgroundlogin/Big-image previsualisation.jpg');" data-index="2"></div>
        <div class="bg-image" style="background-image: url('/static/images/backgroundlogin/EQ2030 - AAP_0.jpg');" data-index="3"></div>
        <div class="bg-image" style="background-image: url('/static/images/backgroundlogin/89d71dc1f6b7b475795d78fa1033c3fe.webp');" data-index="4"></div>
        <div class="bg-image" style="background-image: url('/static/images/backgroundlogin/2240834.avif');" data-index="5"></div>
    </div>

    <!-- Horloge style écran de veille Microsoft -->
    <div class="clock-container" id="clockContainer">
        <div class="clock-time" id="clockTime">00:00</div>
        <div class="clock-date" id="clockDate">lundi 1 janvier 2024</div>
    </div>

    <div class="login-container">
        <div class="landing-wrapper">
            <!-- Logo et Titre -->
            <div class="landing-header">
                <div class="logo-container">
                    {% if company_logo('exists') %}
                        <img src="{{ company_logo('url') }}" alt="Logo TIEKA" class="logo-image">
                    {% else %}
                        <img src="{{ static_versioning('/static/images/logo.png') }}" alt="Logo TIEKA" class="logo-image">
                    {% endif %}
                </div>
                <h1 class="landing-title">
                    {{app_name}}
                </h1>
                <p class="landing-subtitle">
                    Vous aidez à mieux collaborer.
                </p>
            </div>

            <!-- Menu des boutons -->
            <div class="menu-buttons-container">
                <a href="/login?type=bpi" class="menu-button">
                    <i class="fas fa-building menu-button-icon"></i>
                    <span>BPI</span>
                </a>
                <a href="/login?type=partenaire" class="menu-button">
                    <i class="fas fa-handshake menu-button-icon"></i>
                    <span>Partenaire</span>
                </a>
                <a href="/login?type=candidat" class="menu-button">
                    <i class="fas fa-user menu-button-icon"></i>
                    <span>Candidat</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // HORLOGE STYLE ÉCRAN DE VEILLE MICROSOFT
        // ========================================
        (function() {
            const clockTime = document.getElementById('clockTime');
            const clockDate = document.getElementById('clockDate');

            // Noms des jours et mois en français
            const jours = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
            const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 
                         'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

            function updateClock() {
                const now = new Date();
                
                // Formater l'heure (HH:MM)
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                clockTime.textContent = `${hours}:${minutes}`;
                
                // Formater la date
                const jourSemaine = jours[now.getDay()];
                const jour = now.getDate();
                const moisNom = mois[now.getMonth()];
                const annee = now.getFullYear();
                clockDate.textContent = `${jourSemaine} ${jour} ${moisNom} ${annee}`;
            }

            // Mettre à jour immédiatement
            updateClock();
            
            // Mettre à jour toutes les minutes (60000 ms)
            setInterval(updateClock, 60000);
        })();

        // ========================================
        // CARROUSEL D'IMAGES EN ARRIÈRE-PLAN
        // ========================================
        (function() {
            const carousel = document.getElementById('backgroundCarousel');
            const images = carousel.querySelectorAll('.bg-image');
            let currentIndex = 0;
            const intervalTime = 5000; // Change d'image toutes les 5 secondes

            function changeBackground() {
                // Retirer la classe active de l'image actuelle
                images[currentIndex].classList.remove('active');
                
                // Passer à l'image suivante
                currentIndex = (currentIndex + 1) % images.length;
                
                // Ajouter la classe active à la nouvelle image
                images[currentIndex].classList.add('active');
            }

            // Changer l'image toutes les X secondes
            setInterval(changeBackground, intervalTime);
        })();
    </script>
</body>
</html>
