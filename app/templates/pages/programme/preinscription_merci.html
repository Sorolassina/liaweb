{% extends "layouts/base_public.html" %}

{% block title %}
  Merci pour votre préinscription
{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:80vh; background:var(--white-color); padding:40px 20px;">
  
  <div class="card p-5 text-center shadow-lg" style="max-width:600px; border-radius:16px; background:var(--white-color); border:2px solid var(--primary-color);">
    
    <!-- Icône de validation -->
    <div class="mb-4">
      <div style="
        width:100px; height:100px; 
        margin:auto; 
        border-radius:50%; 
        display:flex; 
        align-items:center; 
        justify-content:center; 
        background:linear-gradient(145deg, var(--primary-color), var(--primary-dark));
        box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      ">
        <span style="font-size:3rem;">✅</span>
      </div>
    </div>

    <!-- Message principal -->
    <h2 class="mb-3" style="color:var(--primary-color); font-weight:700; font-size:2rem;">
      Merci pour votre préinscription !
    </h2>
    <p class="mb-4" style="color:var(--gray-dark); font-size:1.15rem; line-height:1.6;">
      Votre demande a bien été enregistrée.<br>
      <strong style="color:var(--secondary-color);">Nous reviendrons vers vous rapidement.</strong>
    </p>

    <!-- Bouton retour -->
    <a href="{{ request.url_for('preinscriptions_public_form') }}?programme={{ current_programme or 'ACD' }}" 
       class="btn px-5 py-3" 
       style="
         background:var(--primary-color); 
         color:var(--secondary-color); 
         border:none; 
         border-radius:12px; 
         font-weight:600; 
         font-size:1.1rem;
         transition:all 0.3s ease;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
       "
       onmouseover="this.style.background='var(--primary-dark)'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(0,0,0,0.15)';"
       onmouseout="this.style.background='var(--primary-color)'; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 8px rgba(0,0,0,0.1)';">
      <i class="fas fa-arrow-left me-2"></i>Retour au formulaire
    </a>
  </div>

</div>
{% endblock %}
