{% extends "layouts/base.html" %}

{% block title %}RDV #{{ rdv.id }} — {{ app_name }}{% endblock %}

{% block head_extra %}
  <style>
    :root{ --bg:#0b0b0b }
    html,body{height:100%}
    body{margin:0;background:var(--bg);}
  
  /* Masquer tous les éléments de navigation pour Jitsi plein écran */
  #sidebar,
  .header-neumorphism,
  .footer-neumorphism,
  .messagerie-floating-container,
  #globalLoadingOverlay {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
  }
  
  /* S'assurer que le body n'a pas de restrictions */
  body {
    overflow: visible !important;
  }
  
  /* Conteneur principal sans padding */
  #content {
    padding: 0 !important;
    margin: 0 !important;
    height: 100vh !important;
    width: 100vw !important;
    overflow: hidden !important;
  }
  
  #content .container-fluid {
    padding: 0 !important;
    margin: 0 !important;
    height: 100% !important;
    width: 100% !important;
  }
  
  #meet {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
  }
</style>
{% endblock %}

{% block content %}
<div id="meet"></div>
{% endblock %}

{% block scripts %}
<script>
  // Désactiver l'overlay de chargement global immédiatement
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof hideGlobalLoading === 'function') {
      hideGlobalLoading();
    }
    const overlay = document.getElementById('globalLoadingOverlay');
    if (overlay) {
      overlay.style.display = 'none';
      overlay.classList.remove('show');
    }
  });
  
    // Configuration Jitsi avec rôles
  const jitsiUrl = "{{ settings.JITSI_URL_ACTIVE }}";
    const jitsiDomain = "{{ settings.JITSI_DOMAIN_ACTIVE }}";
  const roomName = "{{ room_name }}";
  
  // Fonction pour charger et initialiser Jitsi
  function initJitsi() {
    try {
    const options = {
        roomName: roomName,
      parentNode: document.getElementById("meet"),
      width: "100%",
      height: "100%",
      userInfo: { 
        displayName: "{{ display_name }}{% if is_host %} (Conseiller){% else %} (Candidat){% endif %}" 
      },
      configOverwrite: { 
        disableDeepLinking: true,
          useStunTurn: true,
          p2p: { enabled: false },
          enableLayerSuspension: true,
          enableNoAudioDetection: false,
        {% if is_host %}
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        enableLobby: true,
        enableClosePage: false,
        enableWelcomePage: false,
        enablePrejoinPage: false,
        enableInsecureRoomNameWarning: false,
        enableNoisyMicDetection: true,
        channelLastN: -1
        {% else %}
        startWithAudioMuted: true,
        startWithVideoMuted: true,
        enableLobby: false,
        enableClosePage: true,
        enableWelcomePage: false,
        enablePrejoinPage: false,
        disableModeratorIndicator: true,
        enableLayerSuspension: false,
        enableInsecureRoomNameWarning: false,
        enableNoisyMicDetection: false,
        hideDisplayName: false,
          hideEmailInSettings: true
        {% endif %}
      }
    };
    
      if (typeof JitsiMeetExternalAPI === 'undefined') {
        throw new Error("JitsiMeetExternalAPI n'est pas défini. Le script Jitsi n'a pas été chargé correctement.");
      }
      
      // Extraire host:port de l'URL
      let apiDomain = jitsiDomain;
      const urlMatch = jitsiUrl.match(/\/\/([^\/]+)/);
      if (urlMatch) {
        apiDomain = urlMatch[1];
      }

      console.log("🔧 Création de l'API Jitsi avec le domaine:", apiDomain);
      
      const api = new JitsiMeetExternalAPI(apiDomain, options);
      
      // Corriger HTTP/HTTPS pour l'iframe en mode DEBUG uniquement
      {% if settings.DEBUG %}
      if (jitsiUrl.startsWith('http://')) {
        const fixIframeProtocol = () => {
          const iframe = document.querySelector('#meet iframe');
          if (iframe && iframe.src.startsWith('https://') && jitsiUrl.startsWith('http://')) {
            iframe.src = iframe.src.replace('https://', 'http://');
          }
        };
        setTimeout(fixIframeProtocol, 100);
        setTimeout(fixIframeProtocol, 500);
        setTimeout(fixIframeProtocol, 1000);
      }
      {% endif %}
      
      // Ajouter des gestionnaires d'événements immédiats pour déboguer
      api.addEventListener("readyToClose", () => {
        console.log("⚠️ Jitsi readyToClose - la conférence va se fermer");
        if (typeof hideGlobalLoading === 'function') {
          hideGlobalLoading();
        }
      });
      
      api.addEventListener("videoConferenceLeft", () => {
        console.log("⚠️ Jitsi videoConferenceLeft - déconnexion");
        if (typeof hideGlobalLoading === 'function') {
          hideGlobalLoading();
        }
      });
      
      console.log("✅ API Jitsi créée avec succès");
      return api;
    } catch (error) {
      console.error("❌ Erreur lors de l'initialisation de Jitsi:", error);
      throw error;
    }
  }
  
  // Charger le script Jitsi avec fallback
  let scriptUrl = `${jitsiUrl}/external_api.js`;
  let useProxy = false;
  // Utiliser le proxy uniquement pour les serveurs locaux (localhost ou IP locale)
  // Ne pas utiliser le proxy pour les serveurs publics (meet.jit.si, etc.)
  {% if settings.DEBUG %}
  const isLocalServer = jitsiUrl.includes('localhost') || 
                        jitsiUrl.match(/http:\/\/\d+\.\d+\.\d+\.\d+/) ||
                        jitsiUrl.includes('127.0.0.1');
  if (isLocalServer) {
    scriptUrl = `/rendez_vous/jitsi-proxy/external_api.js`;
    useProxy = true;
  }
  {% endif %}
  
  const directScriptUrl = `${jitsiUrl}/external_api.js`;
  
  function loadJitsiScript(url, isRetry = false) {
    const script = document.createElement('script');
    script.src = url;
    script.async = true;
    script.onload = function() {
      try {
        console.log("✅ Script Jitsi chargé, initialisation...");
        window.jitsiApi = initJitsi();
        console.log("✅ API Jitsi créée, configuration des événements...");
        
        // Désactiver l'overlay immédiatement après le chargement
        if (typeof hideGlobalLoading === 'function') {
          hideGlobalLoading();
        }
        const overlay = document.getElementById('globalLoadingOverlay');
        if (overlay) {
          overlay.style.display = 'none';
          overlay.classList.remove('show');
        }
        
        // Configurer les événements après un court délai pour s'assurer que l'API est prête
        setTimeout(() => {
          setupJitsiEvents();
        }, 500);
      } catch (error) {
        console.error("❌ Erreur lors de l'initialisation Jitsi:", error);
        if (typeof hideGlobalLoading === 'function') {
          hideGlobalLoading();
        }
        const errorMsg = `
          <div style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; color: white; font-family: Arial; background: #0b0b0b;">
            <h2 style="color: #ffd300;">⚠️ Erreur de chargement Jitsi</h2>
            <p style="margin: 20px 0;">${error.message}</p>
            <button onclick="location.reload()" style="padding: 10px 20px; background: #ffd300; color: #000; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;">
              Recharger la page
            </button>
          </div>
        `;
        document.getElementById("meet").innerHTML = errorMsg;
      }
    };
    script.onerror = function() {
      console.error("❌ Impossible de charger le script Jitsi depuis:", url);
      
      // Si on utilisait le proxy et que ce n'est pas un retry, essayer l'URL directe
      if (useProxy && !isRetry && url.includes('jitsi-proxy')) {
        console.log("🔄 Le proxy a échoué, tentative de chargement direct depuis Jitsi...");
        loadJitsiScript(directScriptUrl, true);
        return;
      }
      
      // Afficher l'erreur avec des informations utiles
      if (typeof hideGlobalLoading === 'function') {
        hideGlobalLoading();
      }
      
      let errorDetails = "";
      if (useProxy) {
        errorDetails = `
          <p style="font-size: 12px; color: #888; margin: 10px 0;">Le proxy a échoué. Tentative directe effectuée.</p>
          <p style="font-size: 12px; color: #888; margin: 10px 0;">URL proxy: ${url}</p>
          <p style="font-size: 12px; color: #888; margin: 10px 0;">URL directe: ${directScriptUrl}</p>
          <p style="font-size: 12px; color: #888; margin: 10px 0;">Vérifiez que le serveur Jitsi est démarré et accessible à: ${jitsiUrl}</p>
        `;
      } else {
        errorDetails = `
          <p style="font-size: 12px; color: #888; margin: 10px 0;">URL: ${url}</p>
          <p style="font-size: 12px; color: #888; margin: 10px 0;">Vérifiez que votre serveur Jitsi est démarré et accessible.</p>
        `;
      }
      
      document.getElementById("meet").innerHTML = `
        <div style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; color: white; font-family: Arial; background: #0b0b0b;">
          <h2 style="color: #ffd300;">⚠️ Impossible de charger Jitsi</h2>
          <p style="margin: 20px 0;">Le script Jitsi n'a pas pu être chargé.</p>
          ${errorDetails}
          <button onclick="location.reload()" style="padding: 10px 20px; background: #ffd300; color: #000; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px;">
            Recharger la page
          </button>
        </div>
      `;
    };
    
    document.head.appendChild(script);
  }
  
  // Charger le script
  loadJitsiScript(scriptUrl);
  
  // Configuration des événements Jitsi
  function setupJitsiEvents() {
    if (!window.jitsiApi) {
      setTimeout(setupJitsiEvents, 500);
      return;
    }
    
    const api = window.jitsiApi;
    
    // Désactiver l'overlay de chargement une fois que Jitsi est prêt
    if (typeof hideGlobalLoading === 'function') {
      hideGlobalLoading();
    }
    const overlay = document.getElementById('globalLoadingOverlay');
    if (overlay) {
      overlay.style.display = 'none';
      overlay.classList.remove('show');
    }
    
    // Gestionnaire d'événements de connexion réussie
    api.addEventListener("videoConferenceJoined", () => {
      console.log("✅ Connecté à la conférence Jitsi");
      if (typeof hideGlobalLoading === 'function') {
        hideGlobalLoading();
      }
      {% if not is_host %}
      // Pour les candidats, activer audio/vidéo automatiquement
      api.executeCommand("toggleAudio");
      api.executeCommand("toggleVideo");
      {% endif %}
    });
    
    // Gestionnaire d'événements de déconnexion
    api.addEventListener("videoConferenceLeft", () => {
      console.log("⚠️ Déconnexion de la conférence Jitsi");
    });
    
    // Gestionnaire d'erreurs de connexion
    api.addEventListener("readyToClose", () => {
      console.log("⚠️ Jitsi prêt à fermer");
    });
    
    // Gestionnaire d'erreurs
    api.addEventListener("error", (error) => {
      console.error("❌ Erreur Jitsi:", error);
      if (typeof hideGlobalLoading === 'function') {
        hideGlobalLoading();
      }
    });
    
    {% if is_host %}
    // Événements pour l'hôte (conseiller)
    api.addEventListener("participantJoined", (participant) => {
      console.log("✅ Participant rejoint:", participant.displayName);
    });
    
    api.addEventListener("lobbyUserJoined", () => {
      console.log("✅ Utilisateur dans le lobby, admission automatique");
      api.executeCommand("admitEveryone");
    });
    {% endif %}
  }
  
  // Désactiver l'overlay au chargement de la page
  window.addEventListener('load', function() {
    if (typeof hideGlobalLoading === 'function') {
      hideGlobalLoading();
    }
    const overlay = document.getElementById('globalLoadingOverlay');
    if (overlay) {
      overlay.style.display = 'none';
      overlay.classList.remove('show');
    }
  });
  </script>
{% endblock %}
